name: build-windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the GNU toolchain; provide a complete mingw
      # (gcc/as/ld/libgcc) via the runner's preinstalled MSYS2.
      - name: Add MSYS2 mingw64 to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\mingw64\bin"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Tauri build (NSIS)
        env:
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: pnpm exec tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: lepro-connect-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
